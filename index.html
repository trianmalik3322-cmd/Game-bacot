    <meta name="description" content="Game Sandbox Physics Simulator - Main elemen, makhluk hidup, dan banyak fitur keren!" />

    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234c1d95'/><text y='.9em' font-size='85' x='5'>🌍</text></svg>" />

    <!-- PWA Manifest (inline) -->
    <link rel="manifest" href="data:application/json,%7B%22name%22%3A%22SandBox%20World%22%2C%22short_name%22%3A%22SandBox%22%2C%22description%22%3A%22Game%20Sandbox%20Physics%20Simulator%22%2C%22start_url%22%3A%22%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f0f1a%22%2C%22theme_color%22%3A%22%237c3aed%22%2C%22orientation%22%3A%22any%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Crect%20width%3D'100'%20height%3D'100'%20rx%3D'20'%20fill%3D'%234c1d95'%2F%3E%3Ctext%20y%3D'.9em'%20font-size%3D'85'%20x%3D'5'%3E%F0%9F%8C%8D%3C%2Ftext%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D" />

    <title>🌍 SandBox World - Build Your Universe!</title>

    <style>
      /* Splash screen */
      #splash {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #0f0f1a 0%, #1a0533 50%, #0a1628 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.5s ease;
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash .logo {
        font-size: 80px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      #splash .title {
        color: white;
        font-size: 28px;
        font-weight: 900;
        margin-top: 16px;
        font-family: system-ui, sans-serif;
        background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      #splash .subtitle {
        color: #a78bfa;
        font-size: 14px;
        margin-top: 8px;
        font-family: system-ui, sans-serif;
      }
      #splash .loader {
        margin-top: 32px;
        width: 200px;
        height: 4px;
        background: #1e1b4b;
        border-radius: 4px;
        overflow: hidden;
      }
      #splash .loader-bar {
        height: 100%;
        background: linear-gradient(90deg, #7c3aed, #3b82f6);
        border-radius: 4px;
        animation: load 1.5s ease forwards;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
      @keyframes load {
        from { width: 0%; }
        to { width: 100%; }
      }
      /* Safe area untuk notch HP */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen -->
    <div id="splash">
      <div class="logo">🌍</div>
      <div class="title">SandBox World</div>
      <div class="subtitle">Build Your Universe!</div>
      <div class="loader">
        <div class="loader-bar"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Hide splash after load
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) {
            splash.classList.add('fade-out');
            setTimeout(() => splash.remove(), 500);
          }
        }, 1500);
      });
    </script>
  </body>
</html>
